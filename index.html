<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AURORA A1 Grand Prix</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="hud-tl" class="panel">
    <div class="lbl">LAP</div><div id="lap" class="big">1/3</div>
    <div class="row"><span class="lbl">TIME</span><span id="time">0:00.000</span></div>
    <div class="row"><span class="lbl">LAST</span><span id="last">--:--.---</span></div>
    <div class="row"><span class="lbl">BEST</span><span id="best">--:--.---</span></div>
  </div>
  <div id="hud-tr" class="panel">
    <div class="lbl">POS</div><div id="pos" class="big">P4<small>/4</small></div>
    <div id="board"></div>
  </div>
  <canvas id="minimap" width="220" height="220"></canvas>
  <div id="hud-br" class="panel">
    <div id="rpm"><div id="rpmfill"></div></div>
    <div class="spd"><span id="speed">0</span><small>km/h</small></div>
    <div class="gear"><span class="lbl">GEAR</span><span id="gear">N</span></div>
    <div id="cam" class="lbl">CAM: CHASE (C)</div>
  </div>
  <div id="lights"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="msg"></div>
  <div id="touch">
    <button data-k="left">◀</button><button data-k="right">▶</button>
    <span class="sp"></span>
    <button data-k="brake">BRK</button><button data-k="gas">GAS</button>
  </div>
</div>

<!-- Title -->
<div id="title" class="overlay">
  <div class="card">
    <div class="brand">AURORA <b>A1</b></div>
    <h1>GRAND PRIX</h1>
    <p class="sub">FreeCADで設計した AURORA A1 でサーキットを駆け抜けろ</p>
    <div id="loadbar"><div id="loadfill"></div></div>
    <div id="loadtxt">CADモデル読込中…</div>
    <div class="opts">
      <div><span class="lbl">LAPS</span>
        <div class="seg" data-opt="laps"><button data-v="1">1</button><button data-v="3" class="on">3</button><button data-v="5">5</button></div></div>
      <div><span class="lbl">RIVALS</span>
        <div class="seg" data-opt="diff"><button data-v="0">EASY</button><button data-v="1" class="on">NORMAL</button><button data-v="2">HARD</button></div></div>
    </div>
    <button id="start" disabled>START RACE</button>
    <div class="keys">
      <span><kbd>↑</kbd>/<kbd>W</kbd> アクセル</span>
      <span><kbd>↓</kbd>/<kbd>S</kbd> ブレーキ・バック</span>
      <span><kbd>←→</kbd>/<kbd>AD</kbd> ステア</span>
      <span><kbd>C</kbd> カメラ</span>
      <span><kbd>R</kbd> コース復帰</span>
      <span><kbd>M</kbd> サウンド</span>
      <span><kbd>Esc</kbd> ポーズ</span>
    </div>
  </div>
</div>

<!-- Pause -->
<div id="pause" class="overlay hidden">
  <div class="card"><h1>PAUSED</h1>
    <button id="resume">RESUME</button><button id="quit" class="ghost">RETIRE</button></div>
</div>

<!-- Result -->
<div id="result" class="overlay hidden">
  <div class="card">
    <h1 id="res-title">FINISH</h1>
    <table id="res-table"></table>
    <p id="res-best"></p>
    <button id="again">RACE AGAIN</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
